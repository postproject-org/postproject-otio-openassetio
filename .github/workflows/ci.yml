name: CI against PostProject main

on:
  push:
  pull_request:
  schedule:
    - cron: "11 3 * * 1"
  workflow_call:
    inputs:
      postproject_ref:
        required: false
        type: string
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: eseifert/postproject-otio-openassetio
      - uses: actions/checkout@v7
        with:
          repository: eseifert/postproject
          ref: ${{ inputs.postproject_ref || 'main' }}
          path: postproject
      - uses: actions/checkout@v7
        with:
          repository: eseifert/postproject-openassetio
          ref: main
          path: manager-validation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --release --locked -p postproject-ffi
        working-directory: postproject
      - run: python -m pip install ./postproject/python ./manager-validation . pytest
      - run: python -m pip install git+https://github.com/OpenAssetIO/otio-openassetio.git@ee762d7d24670f84c30baa6149123b6d252a9969
      - run: pytest
        env:
          POSTPROJECT_LIBRARY: ${{ github.workspace }}/postproject/target/release/libpostproject.so
